<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibePlay — Discover Amazing Videos</title>
  <meta name="description" content="VibePlay is a modern video discovery platform.">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-deep: #05050a; --bg-surface: #0c0c14; --bg-card: #12121e; --bg-elevated: #1a1a2e;
      --purple: #8b5cf6; --purple-glow: rgba(139, 92, 246, 0.35);
      --blue: #3b82f6; --blue-glow: rgba(59, 130, 246, 0.25);
      --text-primary: #f1f1f6; --text-secondary: #9ca3b8; --text-muted: #6b7194;
      --border-subtle: rgba(255, 255, 255, 0.06); --border-glow: rgba(139, 92, 246, 0.3);
      --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px; --radius-xl: 28px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --header-height: 68px; --bottom-nav-height: 64px;
    }
    body {
      font-family: var(--font); background: var(--bg-deep); color: var(--text-primary);
      min-height: 100vh; overflow-x: hidden; padding-bottom: calc(var(--bottom-nav-height) + 20px);
      -webkit-font-smoothing: antialiased;
    }
    @media (min-width: 768px) { body { padding-bottom: 40px; } }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; color: inherit; }
    img { display: block; max-width: 100%; }
    
    /* Ad Space */
    .ad-container { margin: 20px auto; text-align: center; min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg-surface); border: 1px dashed var(--border-subtle); border-radius: var(--radius-md); overflow: hidden; width: 100%; max-width: 728px; }
    .ad-label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }

    .site-header {
      position: sticky; top: 0; z-index: 100; height: var(--header-height);
      display: flex; align-items: center; gap: 16px; padding: 0 20px;
      background: rgba(5, 5, 10, 0.85); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .logo {
      display: flex; align-items: center; gap: 10px; font-size: 1.5rem; font-weight: 800;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo .logo-icon { font-size: 1.7rem; -webkit-text-fill-color: initial; animation: float 3s infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    
    .search-wrap { flex: 1; max-width: 520px; position: relative; }
    .search-input { width: 100%; height: 44px; padding: 0 16px 0 46px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 50px; color: var(--text-primary); }
    .search-input:focus { outline: none; border-color: var(--purple); }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); opacity: 0.5; }

    .container { max-width: 1320px; margin: 0 auto; padding: 28px 20px 60px; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin: 40px 0 20px; }
    .section-title { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .section-title .accent { background: linear-gradient(135deg, var(--purple), var(--blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .category-bar { display: flex; gap: 10px; overflow-x: auto; padding: 4px 0 16px; scrollbar-width: none; }
    .cat-chip { flex-shrink: 0; padding: 8px 18px; border-radius: 50px; background: var(--bg-surface); border: 1px solid var(--border-subtle); color: var(--text-secondary); font-size: 0.85rem; }
    .cat-chip.active { background: linear-gradient(135deg, var(--purple), var(--blue)); color: #fff; border-color: transparent; }

    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; }
    @media (max-width: 480px) { .video-grid { grid-template-columns: 1fr; gap: 18px; } }

    .video-card {
      background: var(--bg-card); border-radius: var(--radius-lg); overflow: hidden;
      border: 1px solid var(--border-subtle); transition: transform 0.25s, box-shadow 0.25s; cursor: pointer;
    }
    .video-card:hover { transform: translateY(-6px); border-color: var(--border-glow); box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 30px var(--purple-glow); }
    .card-thumb { position: relative; aspect-ratio: 16/9; background: linear-gradient(135deg, #1a1a2e 0%, #12121e 100%); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .card-thumb .emoji-display { font-size: 4.5rem; transition: transform 0.4s; }
    .video-card:hover .emoji-display { transform: scale(1.15) rotate(-5deg); }
    .card-thumb img.thumb-img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
    .play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.35); opacity: 0; transition: opacity 0.25s; }
    .video-card:hover .play-overlay { opacity: 1; }
    .play-btn { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--purple), var(--blue)); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px var(--purple-glow); }
    .play-btn svg { width: 22px; height: 22px; fill: #fff; margin-left: 3px; }
    
    .card-body { padding: 16px; }
    .card-title { font-size: 0.98rem; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }
    .card-meta { display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted); }
    .card-category { padding: 3px 10px; border-radius: 20px; background: var(--bg-elevated); color: var(--purple); font-size: 0.72rem; }

    /* Video Modal - Fixed Size */
    .modal-backdrop { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.92); backdrop-filter: blur(10px); display: none; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
    .modal-backdrop.active { display: flex; }
    .modal-content { width: 100%; max-width: 1000px; margin-top: 20px; background: var(--bg-surface); border-radius: var(--radius-lg); border: 1px solid var(--border-glow); overflow: hidden; box-shadow: 0 20px 80px rgba(0,0,0,0.8); animation: modalSlide 0.3s ease-out; }
    
    @keyframes modalSlide {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-video-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
    .modal-video-wrap iframe, .modal-video-wrap video { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
    .modal-emoji-fallback { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 6rem; background: linear-gradient(135deg, var(--bg-card), var(--bg-elevated)); }
    
    .modal-close { position: absolute; top: 14px; right: 14px; z-index: 10; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: background 0.2s; }
    .modal-close:hover { background: var(--purple); }
    
    .modal-info { padding: 20px 24px 30px; }
    .modal-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; line-height: 1.4; }
    
    /* YouTube style expandable description */
    .desc-box { background: var(--bg-elevated); border-radius: 12px; padding: 12px 16px; margin-bottom: 20px; cursor: pointer; transition: background 0.2s; }
    .desc-box:hover { background: #202030; }
    .desc-text { color: var(--text-primary); font-size: 0.92rem; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
    .desc-text.expanded { -webkit-line-clamp: unset; }
    .desc-toggle { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-top: 8px; display: inline-block; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 90; height: var(--bottom-nav-height); background: rgba(12, 12, 20, 0.92); backdrop-filter: blur(20px); border-top: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-around; }
    @media (min-width: 768px) { .bottom-nav { display: none; } }
    .bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-muted); font-size: 0.65rem; }
    .bottom-nav-item.active { color: var(--purple); }
  </style>
</head>
<body>

  <header class="site-header">
    <a href="#" class="logo"><span class="logo-icon">🎬</span> VibePlay</a>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="search" id="searchInput" class="search-input" placeholder="Search videos..." autocomplete="off">
    </div>
  </header>

  <div class="container" style="padding-bottom: 0;">
    <div class="ad-container" id="adsterra-top">
      <span class="ad-label">Advertisement</span>
    </div>
  </div>

  <main class="container">
    <nav class="category-bar" id="categoryBar">
      <button class="cat-chip active" data-category="all">All Categories</button>
    </nav>

    <!-- Home Sections -->
    <div id="homeSections">
      <section id="trendingSec">
        <div class="section-header"><h2 class="section-title"><span>🔥</span> <span class="accent">Trending Now</span></h2></div>
        <div class="video-grid" id="trendingGrid"></div>
      </section>

      <section id="latestSec">
        <div class="section-header"><h2 class="section-title"><span>🆕</span> <span class="accent">Latest Videos</span></h2></div>
        <div class="video-grid" id="latestGrid"></div>
      </section>
    </div>

    <!-- Filtered Sections (Only visible when searching or category clicked) -->
    <section id="filterSec" style="display: none;">
      <div class="section-header"><h2 class="section-title" id="filterTitle">Results</h2></div>
      <div class="video-grid" id="filterGrid"></div>
      <div style="text-align: center; margin-top: 40px;">
        <button class="cat-chip" id="loadMoreBtn" style="padding: 14px 42px;">Load More</button>
      </div>
    </section>
  </main>

  <!-- Video Modal -->
  <div class="modal-backdrop" id="videoModal">
    <div class="modal-content">
      <div class="modal-video-wrap" id="modalVideoWrap">
        <button class="modal-close" id="modalClose">✕</button>
        <div class="modal-emoji-fallback" id="modalEmoji">🎬</div>
      </div>
      <div class="modal-info">
        <h3 class="modal-title" id="modalTitle"></h3>
        
        <div class="desc-box" id="descBox">
          <div class="desc-text" id="modalDesc"></div>
          <span class="desc-toggle" id="descToggle">See more ▼</span>
        </div>
        
        <div class="ad-container" id="adsterra-player" style="min-height: 60px;">
          <span class="ad-label">Advertisement</span>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="#" class="bottom-nav-item active"><span style="font-size:1.3rem;">🔥</span> Trending</a>
    <a href="#" class="bottom-nav-item"><span style="font-size:1.3rem;">🆕</span> Latest</a>
    <a href="#" class="bottom-nav-item"><span style="font-size:1.3rem;">🎥</span> All</a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDSvXWQ79nrIWRxjYhE_gEyeDKaUSBQfQI",
      authDomain: "vibe-play-833ac.firebaseapp.com",
      projectId: "vibe-play-833ac",
      storageBucket: "vibe-play-833ac.firebasestorage.app",
      messagingSenderId: "948412171672",
      appId: "1:948412171672:web:38c1acf930467e68f7d7ed"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const $ = (sel) => document.querySelector(sel);

    const state = { allVideos: [], filteredVideos: [], currentCategory: 'all', searchTerm: '', displayedCount: 12, pageSize: 12, categories: [] };

    function escapeHtml(str) { if (!str) return ''; const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
    function formatViews(n) { if (!n) return '0 views'; if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M'; if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K'; return n; }

    function getEmbedUrl(url) {
      if (!url) return null;
      const driveMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (driveMatch) return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
      const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
      if (ytMatch) return `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&rel=0`;
      if (/\.(mp4|webm|ogg)(\?|$)/i.test(url)) return url;
      return url;
    }

    function createVideoCard(video) {
      const card = document.createElement('article');
      card.className = 'video-card';
      card.innerHTML = `
        <div class="card-thumb">
          ${video.thumbnailUrl ? `<img class="thumb-img" src="${escapeHtml(video.thumbnailUrl)}" onerror="this.style.display='none'">` : `<span class="emoji-display">${video.emoji || '🎬'}</span>`}
          <div class="play-overlay"><div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
        </div>
        <div class="card-body">
          <h3 class="card-title">${escapeHtml(video.title || 'Untitled')}</h3>
          <div class="card-meta">
            <span class="card-category">${escapeHtml(video.category || 'General')}</span>
            <span>👁 ${formatViews(video.views)}</span>
          </div>
        </div>
      `;
      card.addEventListener('click', () => openVideoModal(video.id));
      return card;
    }

    function renderGrid(container, videos) {
      container.innerHTML = '';
      if (!videos.length) { container.innerHTML = '<p style="color:var(--text-muted);grid-column:1/-1;text-align:center;padding:30px;">No videos found.</p>'; return; }
      videos.forEach(v => container.appendChild(createVideoCard(v)));
    }

    async function loadSiteSettings() {
      try {
        const snap = await getDoc(doc(db, 'siteSettings', 'main'));
        if (snap.exists()) {
          const data = snap.data();
          if (data.adsterraTopCode) {
            $('#adsterra-top').innerHTML = data.adsterraTopCode;
            $('#adsterra-top').querySelectorAll('script').forEach(s => { const newS = document.createElement('script'); newS.textContent = s.textContent; s.replaceWith(newS); });
          }
          if (data.adsterraPlayerCode) {
            $('#adsterra-player').innerHTML = data.adsterraPlayerCode;
            $('#adsterra-player').querySelectorAll('script').forEach(s => { const newS = document.createElement('script'); newS.textContent = s.textContent; s.replaceWith(newS); });
          }
        }
      } catch (e) { console.warn("Ad settings not found", e); }
    }

    async function fetchPublishedVideos() {
      try {
        const q = query(collection(db, 'videos'), where('published', '==', true));
        const snap = await getDocs(q);
        state.allVideos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        
        // Sort by newest
        state.allVideos.sort((a, b) => {
          const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
          const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
          return timeB - timeA;
        });

        const catSet = new Set(); state.allVideos.forEach(v => { if (v.category) catSet.add(v.category); });
        state.categories = [...catSet];
        renderCategoryChips();

        // 1. Trending (Top 4 by views)
        let trendingList = [...state.allVideos].sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 4);
        renderGrid($('#trendingGrid'), trendingList);

        // 2. Latest (Next 4 newest, excluding trending)
        const trendingIds = new Set(trendingList.map(v => v.id));
        let latestList = state.allVideos.filter(v => !trendingIds.has(v.id)).slice(0, 4);
        renderGrid($('#latestGrid'), latestList);

      } catch (err) { 
        console.error("Firebase fetch error:", err); 
      }
    }

    function renderCategoryChips() {
      const bar = $('#categoryBar');
      bar.querySelectorAll('.cat-chip:not([data-category="all"])').forEach(el => el.remove());
      state.categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-chip'; btn.textContent = cat;
        btn.onclick = () => setCategory(cat);
        bar.appendChild(btn);
      });
    }

    function setCategory(cat) {
      state.currentCategory = cat;
      state.displayedCount = state.pageSize;
      $('#searchInput').value = '';
      state.searchTerm = '';
      
      const bar = $('#categoryBar');
      bar.querySelectorAll('.cat-chip').forEach(el => {
        el.classList.toggle('active', el.dataset.category === cat || el.textContent === cat);
      });

      if (cat === 'all') {
        $('#homeSections').style.display = 'block';
        $('#filterSec').style.display = 'none';
      } else {
        $('#homeSections').style.display = 'none';
        $('#filterSec').style.display = 'block';
        $('#filterTitle').innerHTML = `<span>🏷️</span> <span class="accent">${cat} Videos</span>`;
        applyFilters();
      }
    }

    function applyFilters() {
      let list = [...state.allVideos];
      if (state.currentCategory !== 'all') list = list.filter(v => v.category === state.currentCategory);
      if (state.searchTerm.trim()) {
        const term = state.searchTerm.trim().toLowerCase();
        list = list.filter(v => (v.title || '').toLowerCase().includes(term) || (v.category || '').toLowerCase().includes(term));
      }
      state.filteredVideos = list;
      renderGrid($('#filterGrid'), list.slice(0, state.displayedCount));
      $('#loadMoreBtn').style.display = list.length > state.displayedCount ? 'inline-block' : 'none';
    }

    $('#loadMoreBtn').onclick = () => { state.displayedCount += state.pageSize; applyFilters(); };
    
    let searchTimer;
    $('#searchInput').addEventListener('input', (e) => { 
      clearTimeout(searchTimer); 
      searchTimer = setTimeout(() => { 
        state.searchTerm = e.target.value; 
        state.displayedCount = state.pageSize;
        state.currentCategory = 'all';
        
        const bar = $('#categoryBar');
        bar.querySelectorAll('.cat-chip').forEach(el => el.classList.remove('active'));
        bar.querySelector('[data-category="all"]').classList.add('active');

        if (state.searchTerm.trim()) {
          $('#homeSections').style.display = 'none';
          $('#filterSec').style.display = 'block';
          $('#filterTitle').innerHTML = `<span>🔍</span> <span class="accent">Search Results for "${escapeHtml(state.searchTerm)}"</span>`;
          applyFilters();
        } else {
          $('#homeSections').style.display = 'block';
          $('#filterSec').style.display = 'none';
        }
      }, 300); 
    });

    // Video Player Logic
    function openVideoModal(videoId) {
      const video = state.allVideos.find(v => v.id === videoId);
      if (!video) return;
      
      // Increment Views in Database
      try {
        const videoRef = doc(db, 'videos', videoId);
        updateDoc(videoRef, { views: increment(1) });
        video.views = (video.views || 0) + 1;
      } catch(e) { console.log(e); }

      const wrap = $('#modalVideoWrap');
      wrap.querySelectorAll('iframe, video').forEach(el => el.remove());
      
      const embedUrl = getEmbedUrl(video.videoUrl);
      if (embedUrl) {
        if (/\.(mp4|webm|ogg)(\?|$)/i.test(embedUrl)) {
          const vid = document.createElement('video');
          vid.src = embedUrl; vid.controls = true; vid.autoplay = true; vid.style.cssText = 'width:100%;height:100%;object-fit:contain;';
          wrap.appendChild(vid);
        } else {
          const iframe = document.createElement('iframe');
          iframe.src = embedUrl; iframe.allowFullscreen = true; iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
          wrap.appendChild(iframe);
        }
        $('#modalEmoji').style.display = 'none';
      } else {
        $('#modalEmoji').style.display = 'flex';
      }
      
      $('#modalTitle').textContent = video.title || 'Untitled';
      
      const descEl = $('#modalDesc');
      descEl.textContent = video.description || 'No description available.';
      descEl.classList.remove('expanded');
      $('#descToggle').textContent = 'See more ▼';
      $('#descToggle').style.display = descEl.scrollHeight > descEl.clientHeight ? 'inline-block' : 'none';

      $('#videoModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    $('#descBox').onclick = () => {
      const descEl = $('#modalDesc');
      const toggle = $('#descToggle');
      if (descEl.classList.contains('expanded')) {
        descEl.classList.remove('expanded');
        toggle.textContent = 'See more ▼';
      } else {
        descEl.classList.add('expanded');
        toggle.textContent = 'Show less ▲';
      }
    };

    $('#modalClose').onclick = () => { 
      $('#videoModal').classList.remove('active'); 
      document.body.style.overflow = ''; 
      $('#modalVideoWrap').querySelectorAll('iframe, video').forEach(el => el.remove()); 
      $('#modalEmoji').style.display = 'flex'; 
    };

    // Home chip click
    $('#categoryBar').querySelector('[data-category="all"]').onclick = (e) => {
      $('#categoryBar').querySelectorAll('.cat-chip').forEach(el => el.classList.remove('active'));
      e.target.classList.add('active');
      setCategory('all');
    };

    // Init
    loadSiteSettings();
    fetchPublishedVideos();
  </script>
</body>
</html>
